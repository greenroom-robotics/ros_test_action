name: "ROS2 Test Action"
description: "Runs Greenroom's standard ROS2 test setup"
author: "Greenroom Robotics"
branding:
  icon: "package"
  color: "gray-dark"
inputs:
  token:
    description: "The Github token with access to the packages repo and release api"
    required: true
  ros_distro:
    description: "The ROS2 distro to use"
    required: false
  gpu:
    description: "Whether to build with GPU support (true/false)"
    required: false
    default: "false"
  tests:
    description: "Whether to run tests (true/false)"
    required: false
    default: "true"
  submodules:
    description: "Checkout git submodules: 'false', 'true', or 'recursive'"
    required: false
    default: "false"
  test_timeout:
    description: "Time limit for the test step, e.g. '60m'. Empty means no limit."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout this repository
      uses: actions/checkout@v6
      with:
        lfs: true
        # Opt-in via the `submodules` input. The token lets checkout fetch
        # private submodules (it rewrites git@github.com URLs to token HTTPS).
        submodules: ${{ inputs.submodules }}
        token: ${{ inputs.token }}

    # Added after flakiness notes on self-hosted runners (runs-on).
    # More details in: https://github.com/actions/checkout/issues/270
    - name: Fetching LFS Data
      shell: bash
      run: |
        git lfs pull --exclude=""

    # - name: Collect Workflow Telemetry
    #   uses: Greenroom-Robotics/workflow-telemetry-action@main

    - name: Build Docker Container
      shell: bash
      env:
        API_TOKEN_GITHUB: ${{ inputs.token }}
        GPU: ${{ inputs.gpu }}
        ROS_DISTRO: ${{ inputs.ros_distro }}
      run: docker compose build

    - name: Run Tests
      if: ${{ inputs.tests == 'true' }}
      shell: bash
      env:
        API_TOKEN_GITHUB: ${{ inputs.token }}
        GPU: ${{ inputs.gpu }}
        ROS_DISTRO: ${{ inputs.ros_distro }}
        TEST_TIMEOUT: ${{ inputs.test_timeout }}
      run: |
        mkdir results && chmod a+w results
        # Named, so it's removed even after a timeout or cancel
        name="ros-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$$"
        trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
        if [ -n "$TEST_TIMEOUT" ]; then
          timeout --kill-after=1m "$TEST_TIMEOUT" docker compose run --rm --name "$name" tests
        else
          docker compose run --rm --name "$name" tests
        fi

    - name: Publish Test Report
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 #v3
      if: ${{ always() && inputs.tests == 'true' && hashFiles('results/**/*.xml') != '' }}
      with:
        name: Test Report
        path: 'results/**/*.xml'
        reporter: java-junit
        fail-on-error: false
